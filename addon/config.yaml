name: Petlibro Local
description: Local MQTT control for Petlibro fountains and feeders — no cloud required
url: https://github.com/smcneece/petlibro-local
version: "2026.10.8"
slug: petlibro_local
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8765
panel_icon: mdi:cat
panel_title: Petlibro Local
homeassistant_api: true
hassio_api: true
hassio_role: admin
host_network: true
# All optional. Leave blank to configure MQTT in the web UI (unchanged behaviour);
# set a value here and it overrides the UI for that field. ha_* are only needed for
# HA notifications and are redundant for the add-on (the Supervisor token is used).
options: {}
schema:
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_pass: password?
  ha_base_url: str?
  ha_token: password?
